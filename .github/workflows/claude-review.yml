name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Este es un repo de práctica de un taller de MCP. Cada PR implementa
            una sola función pequeña en src/login/ o src/sidebar/ a partir de
            un TODO y su test correspondiente en tests/login/ o tests/sidebar/.

            Revisa este PR con foco en:
            - ¿La función hace exactamente lo que pide el TODO? ¿Pasa su test?
            - ¿Se modificó solo la función de la tarea, o se tocó algo más de lo pedido?
            - Bugs o casos borde no cubiertos por el test existente.
            - Legibilidad — no hace falta que sea código de producción, es un ejercicio.

            Nota: el branch del PR ya está descargado en el directorio actual.

            Usa `gh pr comment` para comentarios generales.
            Usa `mcp__github_inline_comment__create_inline_comment` (con `confirmed: true`)
            para señalar líneas específicas.
            Solo publica comentarios en GitHub — no repitas el texto de la revisión
            como mensaje aparte.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm test)"
